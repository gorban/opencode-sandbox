name: oc-sandbox baselines

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  # CodeQL also scans trusted main: every merge, and weekly so new queries reach old code.
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 3'

permissions: {}

# A newer run replaces an older one for the same pull request. A run on main has its own group,
# so every commit on main keeps its analysis.
concurrency:
  group: ci-baselines-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Python coverage baseline
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -IB tools/ci/core_coverage.py

  # Keep this job in this file with these categories. Code scanning matches a pull request's
  # results to main's by workflow path, job and category.
  codeql:
    name: CodeQL baseline (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true

  dependency-review:
    name: Dependency Review baseline
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 60
