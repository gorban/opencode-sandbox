sonar.sources=.
sonar.tests=tests
# Keep test paths out of the source scope. The test scope still includes them.
sonar.exclusions=tests/**
# Archived spike probes under docs/prds/spikes/ are not production sources for CPD.
sonar.cpd.exclusions=docs/prds/spikes/**
# Start at the host minimum and end at SonarCloud's documented full support.
sonar.python.version=3.11,3.12,3.13,3.14
