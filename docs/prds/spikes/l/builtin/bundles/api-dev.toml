schema_version = 1
kind = "bundle@1"
id = "builtin/api-dev"
description = "API development bundle using [local] conditional acquisition (pulls local API + transitive Postgres when API_ENDPOINT is blank)."
skills = ["builtin/api-debugging"]
instructions = [
  "Use the api_client MCP tool to inspect API routes and verify schema migrations."
]

[mise_tools]
"aqua:astral-sh/uv" = "0.13.6"

[mcp.api_client]
type = "remote"
url = "http://127.0.0.1:8080/mcp"
tools = ["query_ro", "mutate_write"]

[mcp.api_client.headers]
Authorization = "Bearer {file:/run/secrets/api_mcp_token}"

[mcp.api_client.local]
binding_key = "API_ENDPOINT"
service = "builtin/api-demo"
url = "http://127.0.0.1:8080/mcp"
