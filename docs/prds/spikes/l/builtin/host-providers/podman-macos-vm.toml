schema_version = 1
kind = "host-provider@1"
id = "builtin/podman-macos-vm"
description = "Remote macOS Podman Machine VM accessed over pinned SSH with GatewayPorts guard."
engine = "podman-macos-vm"

[capabilities]
supports_pods = true
supports_pasta = false
supports_image_mounts = true
supports_reflink = false
supports_wayland = false
supports_dind = false
multi_tenant_loopback = false

[lease_limits]
max_ttl_seconds = 28800
idle_timeout_seconds = 1800
